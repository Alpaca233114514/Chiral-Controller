services:
  relay:
    build:
      context: .
      dockerfile: services/relay/Dockerfile
    restart: unless-stopped
    env_file:
      - services/relay/.env
    volumes:
      - relay-data:/data
    networks:
      - chiral

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - chiral

networks:
  chiral:

volumes:
  relay-data:
  caddy-data:
  caddy-config:
